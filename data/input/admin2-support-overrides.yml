# GeoNames admin2 粒度过滤。
# 用于排除语义过细或不稳定的二级区域。

- countryCode: CN
  reason: GeoNames 中国 admin2 同时包含地级和县级口径；保留直辖市 admin2，以及四位数字且末两位为 01-70 的地级代码。
  includeAdmin1Codes:
    - "22"
    - "23"
    - "28"
    - "33"
  includeAdmin2CodeRules:
    - pattern: ^[0-9]{4}$
      lastTwoMin: 1
      lastTwoMax: 70
